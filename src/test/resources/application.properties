# The CLI registry has no host so references stay fully qualified and registries.conf rewrites apply.
quarkus.oras.registries.foobar.devservice=false
# Only used to start a zot dev service on a fixed port referenced by home/.config/containers/registries.conf.
quarkus.oras.registries.zot.devservice=true
quarkus.oras.devservices.base-port=15000
