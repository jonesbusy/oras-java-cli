# Test registries.conf: Surefire sets HOME to the directory holding this file.
unqualified-search-registries = ["localhost:15000"]

[[registry]]
location = "localhost:15000"
insecure = true

[[registry]]
prefix = "registry.example.com/demo"
location = "localhost:15000/rewritten"

[aliases]
"short-app" = "localhost:15000/rewritten/app"
