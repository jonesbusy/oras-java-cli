name: release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag (for example 1.2.3 or v1.2.3)" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build and test executable JAR
        run: mvn --batch-mode --no-transfer-progress -Drevision="$RELEASE_VERSION" -Dchangelist= verify

      - name: Build Linux native executable
        run: mvn --batch-mode --no-transfer-progress -Drevision="$RELEASE_VERSION" -Dchangelist= package -Dnative -Dquarkus.native.container-build=true -DskipTests

      - name: Prepare release files
        run: |
          test -s target/orasj.jar
          test -x target/orasj
          mkdir -p dist
          cp target/orasj "dist/orasj-${RELEASE_VERSION}-linux-x86_64"
          cp target/orasj.jar "dist/orasj-${RELEASE_VERSION}.jar"
          (cd dist && sha256sum "orasj-${RELEASE_VERSION}-linux-x86_64" "orasj-${RELEASE_VERSION}.jar" > SHA256SUMS)

      - name: Upload release files for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Create GitHub release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/orasj-${RELEASE_VERSION}-linux-x86_64" \
              "dist/orasj-${RELEASE_VERSION}.jar" \
              dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/orasj-${RELEASE_VERSION}-linux-x86_64" \
              "dist/orasj-${RELEASE_VERSION}.jar" \
              dist/SHA256SUMS \
              --verify-tag \
              --title "orasj ${RELEASE_TAG}" \
              --generate-notes
          fi
